<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e293b;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      gap: 12px;
    }
    .file-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-download {
      background: #0f6cbf;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border: none;
    }
    .btn-download:hover { background: #0a4f8a; }
    #pdf-container {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }
    .error-box {
      padding: 2rem;
      text-align: center;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="file-title">📄 {{FILE_NAME}}</span>
    <a id="download-link" class="btn-download" download="{{FILE_NAME}}">⬇ Descargar PDF</a>
  </div>
  <iframe id="pdf-container"></iframe>

  <!-- Guardamos el DataURL de forma segura sin romper comillas de JS -->
  <script id="raw-data" type="text/plain">{{FILE_DATA_URL}}</script>

  <script>
    (function() {
      try {
        const dataUrl = document.getElementById('raw-data').textContent.trim();
        if (!dataUrl || !dataUrl.includes(',')) {
          throw new Error("El archivo PDF está vacío o corrupto.");
        }

        const base64 = dataUrl.split(',')[1];
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const blob = new Blob([bytes], { type: 'application/pdf' });
        const blobUrl = URL.createObjectURL(blob);

        document.getElementById('pdf-container').src = blobUrl;
        document.getElementById('download-link').href = blobUrl;
      } catch (err) {
        document.body.innerHTML = `<div class="error-box"><h3>No se pudo renderizar el PDF</h3><p style="margin-top:8px;color:#94a3b8;font-size:14px;">${err.message}</p></div>`;
      }
    })();
  </script>
</body>
</html>
