<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <!-- Importar PDF.js desde CDN -->
  <script src="https://cloudflare.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Evita seleccionar texto o elementos */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #2b2b2b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3d3d3d;
      z-index: 10;
    }
    .doc-title {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background-color: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #505050;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-info {
      font-size: 13px;
      min-width: 85px;
      text-align: center;
    }
    #viewer-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }
    canvas {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      background-color: #ffffff;
      max-width: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #cccccc;
    }
  </style>
</head>
<!-- Bloquea el clic derecho en toda la página -->
<body oncontextmenu="return false;">

  <header>
    <div class="doc-title" title="{{FILE_NAME}}">{{FILE_NAME}}</div>
    <div class="controls">
      <button id="prev-page" disabled>Anterior</button>
      <span class="page-info">Pág. <span id="page-num">0</span> / <span id="page-count">0</span></span>
      <button id="next-page" disabled>Siguiente</button>
      <button id="zoom-out">-</button>
      <button id="zoom-in">+</button>
    </div>
  </header>

  <div id="viewer-container">
    <div id="loading">Cargando documento...</div>
    <canvas id="pdf-render" style="display: none;"></canvas>
  </div>

  <script>
    // Inyección de variables de plantilla
    const fileDataUrl = "{{FILE_DATA_URL}}";
    const fileName = "{{FILE_NAME}}";

    // Configurar el worker de PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null,
        scale = 1.3;

    const canvas = document.getElementById('pdf-render'),
          ctx = canvas.getContext('2d'),
          loadingEl = document.getElementById('loading');

    // Renderizar una página específica
    const renderPage = num => {
      pageIsRendering = true;

      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderCtx = {
          canvasContext: ctx,
          viewport: viewport
        };

        page.render(renderCtx).promise.then(() => {
          pageIsRendering = false;
          if (pageNumIsPending !== null) {
            renderPage(pageNumIsPending);
            pageNumIsPending = null;
          }
        });

        document.getElementById('page-num').textContent = num;
        updateButtons();
      });
    };

    // Encolar renderizado si ya hay uno en proceso
    const queueRenderPage = num => {
      if (pageIsRendering) {
        pageNumIsPending = num;
      } else {
        renderPage(num);
      }
    };

    // Actualizar estado de los botones de navegación
    const updateButtons = () => {
      document.getElementById('prev-page').disabled = (pageNum <= 1);
      document.getElementById('next-page').disabled = (pageNum >= pdfDoc.numPages);
    };

    // Cargar el documento desde el Data URL
    pdfjsLib.getDocument(fileDataUrl).promise.then(pdfDoc_ => {
      pdfDoc = pdfDoc_;
      document.getElementById('page-count').textContent = pdfDoc.numPages;
      loadingEl.style.display = 'none';
      canvas.style.display = 'block';
      renderPage(pageNum);
    }).catch(err => {
      loadingEl.textContent = 'Error al cargar el archivo PDF.';
      console.error(err);
    });

    // Eventos de controles
    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      if (scale >= 3.0) return;
      scale += 0.25;
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (scale <= 0.5) return;
      scale -= 0.25;
      queueRenderPage(pageNum);
    });

    // Bloquear atajos de teclado comunes para guardar o imprimir (Ctrl+S, Ctrl+P)
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'p')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
