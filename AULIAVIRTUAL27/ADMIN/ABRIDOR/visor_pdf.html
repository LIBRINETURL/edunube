<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{FILE_NAME}}</title>
    <!-- Importamos PDF.js desde CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Evita seleccionar texto */
            -webkit-user-select: none;
        }

        body {
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra superior personalizada sin botones de descarga */
        header {
            background-color: #1e1e1e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .file-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background-color: #3a3a3a;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #505050;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #page-info {
            font-size: 13px;
            min-width: 90px;
            text-align: center;
        }

        /* Contenedor del lienzo (Canvas) */
        #viewer-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        canvas {
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            max-width: 100%;
            height: auto;
        }

        /* Ocultar todo si el usuario intenta imprimir la página (Ctrl+P) */
        @media print {
            body {
                display: none !important;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Bloquea el menú contextual (clic derecho) -->

    <header>
        <div class="file-title" title="{{FILE_NAME}}">{{FILE_NAME}}</div>
        
        <div class="controls">
            <button id="prev-page">Anterior</button>
            <span id="page-info">Página <span id="page-num">0</span> / <span id="page-count">0</span></span>
            <button id="next-page">Siguiente</button>
            <button id="zoom-out">-</button>
            <button id="zoom-in">+</button>
        </div>
    </header>

    <div id="viewer-container">
        <canvas id="pdf-render"></canvas>
    </div>

    <script>
        // Variables inyectadas por tu backend / plantilla
        const fileDataUrl = "{{FILE_DATA_URL}}";
        const fileName = "{{FILE_NAME}}";

        // Configuración del Worker de PDF.js
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null,
            scale = 1.3; // Zoom inicial

        const canvas = document.getElementById('pdf-render'),
              ctx = canvas.getContext('2d');

        // Función para renderizar la página
        const renderPage = num => {
            pageIsRendering = true;

            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderCtx = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;

                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });

                // Actualizar contador de páginas y botones
                document.getElementById('page-num').textContent = num;
                document.getElementById('prev-page').disabled = (num <= 1);
                document.getElementById('next-page').disabled = (num >= pdfDoc.numPages);
            });
        };

        // Cola de renderizado si el usuario cambia rápido de página
        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        // Controles de navegación y zoom
        document.getElementById('prev-page').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            if (scale >= 3.0) return;
            scale += 0.25;
            queueRenderPage(pageNum);
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            if (scale <= 0.5) return;
            scale -= 0.25;
            queueRenderPage(pageNum);
        });

        // Bloquear atajos de teclado para guardar (Ctrl+S) o imprimir (Ctrl+P)
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S' || e.key === 'P')) {
                e.preventDefault();
            }
        });

        // Cargar el documento desde {{FILE_DATA_URL}}
        pdfjsLib.getDocument(fileDataUrl).promise.then(pdfDoc_ => {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;
            renderPage(pageNum);
        }).catch(err => {
            console.error('Error al cargar el PDF:', err);
            document.getElementById('viewer-container').innerHTML = 
                `<p style="color: #ff6b6b; margin-top: 20px;">No se pudo cargar el documento: ${fileName}</p>`;
        });
    </script>
</body>
</html>
