<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <!-- Cargamos PDF.js desde CDN -->
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --toolbar-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Barra superior */
    .toolbar {
      height: 56px;
      background-color: var(--toolbar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      font-size: 0.95rem;
      max-width: 40%;
    }

    .file-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: #334155;
      color: var(--text-color);
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator, .zoom-indicator {
      font-size: 0.85rem;
      padding: 0 8px;
      color: #cbd5e1;
      min-width: 75px;
      text-align: center;
    }

    /* Contenedor del PDF */
    #viewer-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* Personalización de la barra de desplazamiento */
    #viewer-container::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    #viewer-container::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    #viewer-container::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 5px;
    }
    #viewer-container::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .pdf-page-canvas {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      background: white;
      max-width: 100%;
      height: auto !important;
    }

    /* Pantalla de carga */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 50;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Ocultar todo si intentan imprimir */
    @media print {
      body { display: none !important; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Pantalla de carga inicial -->
  <div id="loader">
    <div class="spinner"></div>
    <span style="color: #94a3b8; font-size: 0.9rem;">Cargando documento seguro...</span>
  </div>

  <!-- Barra de herramientas superior -->
  <div class="toolbar">
    <div class="file-info">
      <span class="badge">SOLO LECTURA</span>
      <span class="file-name" title="{{FILE_NAME}}">{{FILE_NAME}}</span>
    </div>

    <div class="controls">
      <button id="prev-page" title="Página anterior">◀</button>
      <span class="page-indicator">Pág. <span id="page-num">1</span> / <span id="page-count">-</span></span>
      <button id="next-page" title="Página siguiente">▶</button>
    </div>

    <div class="controls">
      <button id="zoom-out" title="Alejar">➖</button>
      <span class="zoom-indicator" id="zoom-level">120%</span>
      <button id="zoom-in" title="Acercar">➕</button>
    </div>
  </div>

  <!-- Área donde se dibujan las páginas -->
  <div id="viewer-container"></div>

  <script>
    // Bloquear atajos de teclado de descarga, impresión y guardado (Ctrl+S, Ctrl+P, Ctrl+U)
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });

    // Configuración de PDF.js
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

    const url = "{{FILE_DATA_URL}}";
    let pdfDoc = null;
    let scale = 1.2; // Zoom inicial
    const container = document.getElementById('viewer-container');
    const loader = document.getElementById('loader');

    // Renderizar todas las páginas en cascada
    async function renderAllPages() {
      container.innerHTML = ''; // Limpiar contenedor
      for (let num = 1; num <= pdfDoc.numPages; num++) {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page-canvas';
        canvas.id = `page-${num}`;
        const ctx = canvas.getContext('2d');

        // Ajuste para pantallas Retina / Alta densidad
        const outputScale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        container.appendChild(canvas);

        await page.render({
          canvasContext: ctx,
          transform: transform,
          viewport: viewport
        }).promise;
      }
      loader.style.display = 'none';
    }

    // Cargar el documento PDF
    pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('page-count').textContent = pdfDoc.numPages;
      renderAllPages();
    }).catch(function(error) {
      loader.innerHTML = `<span style="color: #ef4444;">Error al cargar el PDF. Verifica el origen del archivo.</span>`;
      console.error(error);
    });

    // Controles de Zoom
    document.getElementById('zoom-in').addEventListener('click', () => {
      if (scale >= 2.5) return;
      scale += 0.2;
      document.getElementById('zoom-level').textContent = Math.round(scale * 100) + '%';
      renderAllPages();
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (scale <= 0.6) return;
      scale -= 0.2;
      document.getElementById('zoom-level').textContent = Math.round(scale * 100) + '%';
      renderAllPages();
    });

    // Navegación rápida entre páginas
    let currentPage = 1;
    function scrollToPage(num) {
      const target = document.getElementById(`page-${num}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
        currentPage = num;
        document.getElementById('page-num').textContent = currentPage;
      }
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (currentPage > 1) scrollToPage(currentPage - 1);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pdfDoc && currentPage < pdfDoc.numPages) scrollToPage(currentPage + 1);
    });

    // Actualizar número de página al hacer scroll manual
    container.addEventListener('scroll', () => {
      if (!pdfDoc) return;
      const canvases = document.querySelectorAll('.pdf-page-canvas');
      canvases.forEach((canvas, index) => {
        const rect = canvas.getBoundingClientRect();
        if (rect.top >= 0 && rect.top <= window.innerHeight / 2) {
          currentPage = index + 1;
          document.getElementById('page-num').textContent = currentPage;
        }
      });
    });
  </script>
</body>
</html>
