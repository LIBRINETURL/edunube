<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-bar: #111827;
      --bg-panel: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .progress-track { height: 3px; width: 100%; background: #1e293b; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #38bdf8); transition: width 0.25s ease; }
    .toolbar {
      background: var(--bg-bar);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
      z-index: 20;
    }
    .group { display: flex; align-items: center; gap: 6px; }
    .file-title {
      font-size: 13px; font-weight: 700; max-width: 250px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e2e8f0;
    }
    button {
      background: var(--bg-panel); color: var(--text); border: 1px solid #334155;
      padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s ease;
    }
    button:hover:not(:disabled) { background: #334155; border-color: #475569; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-pill {
      background: #0f172a; border: 1px solid var(--border); padding: 4px 10px;
      border-radius: 8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px;
    }
    .page-pill input {
      width: 36px; background: transparent; border: none; color: #38bdf8;
      font-weight: 700; text-align: center; font-size: 12px; outline: none;
    }
    .workspace { flex: 1; display: flex; overflow: hidden; position: relative; }
    .sidebar {
      width: 175px; background: #0f172a; border-right: 1px solid var(--border);
      overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px;
      transition: width 0.2s ease, padding 0.2s ease;
    }
    .sidebar.collapsed { width: 0; padding: 0; border: none; overflow: hidden; }
    .thumb-card {
      background: #1e293b; border: 2px solid transparent; border-radius: 8px;
      padding: 6px; cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .thumb-card:hover { border-color: #64748b; }
    .thumb-card.active { border-color: var(--accent); background: #1e3a8a44; }
    .thumb-card canvas { width: 100%; height: auto; border-radius: 4px; background: white; display: block; }
    .thumb-label { font-size: 11px; color: var(--text-muted); margin-top: 5px; font-weight: 600; }
    .viewer-container {
      flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start;
      padding: 28px; background-image: radial-gradient(#1e293b 1.2px, transparent 1.2px); background-size: 22px 22px;
    }
    .page-wrapper {
      position: relative; display: none; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      border-radius: 6px; overflow: hidden;
    }
    #pdf-canvas { display: block; background: white; }
    .loading {
      margin: auto; text-align: center; color: var(--text-muted); font-size: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .spinner {
      width: 34px; height: 34px; border: 3px solid #334155; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 18px; right: 18px; background: #1e293b; border: 1px solid #475569;
      color: #f8fafc; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600;
      opacity: 0; transform: translateY(10px); transition: all 0.2s; pointer-events: none; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="toolbar">
    <div class="group">
      <button onclick="toggleSidebar()">📑 Páginas</button>
      <span class="file-title">📄 {{FILE_NAME}}</span>
    </div>

    <div class="group">
      <button id="prev-page" onclick="onPrevPage()" disabled>◀</button>
      <div class="page-pill">
        <input type="number" id="page-input" min="1" value="1" onchange="jumpToPage(this.value)">
        <span>/ <span id="page-count">-</span></span>
      </div>
      <button id="next-page" onclick="onNextPage()" disabled>▶</button>
    </div>

    <div class="group">
      <button onclick="zoomOut()">➖</button>
      <span id="zoom-label" style="font-size:12px;font-weight:700;min-width:42px;text-align:center;">125%</span>
      <button onclick="zoomIn()">➕</button>
      <button onclick="fitWidth()">↔ Ancho</button>
      <button onclick="rotateDoc()">↻</button>
    </div>

    <div class="group">
      <button onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>

  <div class="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="viewer-container" id="viewer-container">
      <div id="loading-msg" class="loading">
        <div class="spinner"></div>
        <span>Cargando documento PDF...</span>
      </div>
      <div class="page-wrapper" id="page-wrapper">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script id="raw-data" type="text/plain">{{FILE_DATA_URL}}</script>

  <script>
    let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null, scale = 1.25, rotation = 0;
    const canvas = document.getElementById('pdf-canvas'), ctx = canvas.getContext('2d');
    const pageWrapper = document.getElementById('page-wrapper'), loadingMsg = document.getElementById('loading-msg');

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function initPdfViewer() {
      const raw = document.getElementById('raw-data').textContent.trim();
      if (!raw) return;
      try {
        const base64 = raw.includes(',') ? raw.split(',')[1].replace(/\s/g, '') : raw.replace(/\s/g, '');
        const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));

        pdfjsLib.getDocument({ data: bytes, disableWorker: true }).promise.then(async function(pdf) {
          pdfDoc = pdf;
          loadingMsg.style.display = 'none';
          pageWrapper.style.display = 'block';
          document.getElementById('page-count').textContent = pdf.numPages;
          document.getElementById('page-input').max = pdf.numPages;
          renderPage(pageNum);
          buildThumbnails();
        });
      } catch (err) {
        loadingMsg.innerHTML = `<span style="color:#f43f5e;">Error al abrir el PDF</span>`;
      }
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale, rotation: rotation });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
          pageRendering = false;
          if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
        });
      });
      document.getElementById('page-input').value = num;
      document.getElementById('prev-page').disabled = (num <= 1);
      document.getElementById('next-page').disabled = (num >= pdfDoc.numPages);
      document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
      document.getElementById('progress-fill').style.width = ((num / pdfDoc.numPages) * 100) + '%';
      document.querySelectorAll('.thumb-card').forEach((el, idx) => el.classList.toggle('active', idx + 1 === num));
    }

    function queueRenderPage(num) { if (pageRendering) pageNumPending = num; else renderPage(num); }
    function onPrevPage() { if (pageNum > 1) { pageNum--; queueRenderPage(pageNum); } }
    function onNextPage() { if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; queueRenderPage(pageNum); } }
    function jumpToPage(val) {
      let t = parseInt(val, 10);
      if (!isNaN(t)) { pageNum = Math.max(1, Math.min(pdfDoc.numPages, t)); queueRenderPage(pageNum); }
    }
    function zoomIn() { scale = Math.min(3.0, +(scale + 0.2).toFixed(2)); queueRenderPage(pageNum); }
    function zoomOut() { scale = Math.max(0.5, +(scale - 0.2).toFixed(2)); queueRenderPage(pageNum); }
    function fitWidth() {
      pdfDoc.getPage(pageNum).then(page => {
        const w = document.getElementById('viewer-container').clientWidth - 70;
        scale = Math.max(0.5, Math.min(2.5, +(w / page.getViewport({ scale: 1, rotation }).width).toFixed(2)));
        queueRenderPage(pageNum);
        showToast('Ajustado al ancho');
      });
    }
    function rotateDoc() { rotation = (rotation + 90) % 360; queueRenderPage(pageNum); }
    async function buildThumbnails() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';
      for (let i = 1; i <= Math.min(pdfDoc.numPages, 30); i++) {
        const card = document.createElement('div');
        card.className = 'thumb-card' + (i === 1 ? ' active' : '');
        card.onclick = () => { pageNum = i; queueRenderPage(i); };
        const tc = document.createElement('canvas');
        card.appendChild(tc);
        card.appendChild(Object.assign(document.createElement('div'), {className: 'thumb-label', textContent: `Pág ${i}`}));
        sidebar.appendChild(card);
        const p = await pdfDoc.getPage(i), vp = p.getViewport({ scale: 0.22 });
        tc.width = vp.width; tc.height = vp.height;
        await p.render({ canvasContext: tc.getContext('2d'), viewport: vp }).promise;
      }
    }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    initPdfViewer();
  </script>
</body>
</html>
