<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .toolbar {
      height: 54px;
      padding: 0 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .doc-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: #475569;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 12px;
      font-weight: 600;
      min-width: 78px;
      text-align: center;
      color: #cbd5e1;
    }

    .zoom-indicator {
      font-size: 12px;
      font-weight: 600;
      min-width: 48px;
      text-align: center;
      color: #cbd5e1;
    }

    .stage {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 14px;
      background: #0f172a;
    }

    canvas {
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      max-width: 100%;
      height: auto;
    }

    .status {
      margin-top: 40px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="app">
    <header class="toolbar">
      <div class="doc-title" title="{{FILE_NAME}}">{{FILE_NAME}}</div>

      <div class="controls">
        <button id="prev-page" class="btn" type="button" disabled>← Anterior</button>
        <span id="page-info" class="page-indicator">- / -</span>
        <button id="next-page" class="btn" type="button" disabled>Siguiente →</button>

        <button id="zoom-out" class="btn" type="button" title="Alejar">−</button>
        <span id="zoom-info" class="zoom-indicator">100%</span>
        <button id="zoom-in" class="btn" type="button" title="Acercar">+</button>
      </div>
    </header>

    <main id="stage" class="stage">
      <div id="status" class="status">Cargando documento PDF...</div>
      <canvas id="pdf-canvas" style="display: none;"></canvas>
    </main>
  </div>

  <script>
    const FILE_DATA_URL = "{{FILE_DATA_URL}}";

    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    if (pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1.25;
    let isRendering = false;
    let pendingPage = null;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const pageInfoEl = document.getElementById('page-info');
    const zoomInfoEl = document.getElementById('zoom-info');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');

    function dataUrlToUint8Array(dataUrl) {
      const parts = dataUrl.split(',');
      if (parts.length < 2) return null;
      const binary = atob(parts[1].replace(/\s/g, ''));
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function updateControls() {
      const total = pdfDoc ? pdfDoc.numPages : 0;
      pageInfoEl.textContent = total ? `${currentPage} / ${total}` : '- / -';
      zoomInfoEl.textContent = `${Math.round(scale * 100)}%`;
      prevBtn.disabled = !pdfDoc || currentPage <= 1;
      nextBtn.disabled = !pdfDoc || currentPage >= total;
    }

    async function renderPage(num) {
      if (!pdfDoc) return;
      if (isRendering) {
        pendingPage = num;
        return;
      }
      isRendering = true;

      try {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({
          canvasContext: ctx,
          viewport
        }).promise;

        currentPage = num;
        statusEl.style.display = 'none';
        canvas.style.display = 'block';
        updateControls();
      } catch (err) {
        statusEl.style.display = 'block';
        canvas.style.display = 'none';
        statusEl.textContent = 'No se pudo renderizar la página del PDF.';
      } finally {
        isRendering = false;
        if (pendingPage !== null) {
          const next = pendingPage;
          pendingPage = null;
          renderPage(next);
        }
      }
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) renderPage(currentPage - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (pdfDoc && currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
    });

    zoomInBtn.addEventListener('click', () => {
      scale = Math.min(2.5, +(scale + 0.25).toFixed(2));
      renderPage(currentPage);
    });

    zoomOutBtn.addEventListener('click', () => {
      scale = Math.max(0.5, +(scale - 0.25).toFixed(2));
      renderPage(currentPage);
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
      if (e.key === 'ArrowLeft' && currentPage > 1) renderPage(currentPage - 1);
      if (e.key === 'ArrowRight' && pdfDoc && currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
    });

    async function initPdf() {
      try {
        const bytes = dataUrlToUint8Array(FILE_DATA_URL);
        if (!bytes || bytes.length === 0) {
          statusEl.textContent = 'Archivo PDF vacío o no válido.';
          return;
        }
        const loadingTask = pdfjsLib.getDocument({ data: bytes });
        pdfDoc = await loadingTask.promise;
        await renderPage(1);
      } catch (err) {
        statusEl.textContent = 'Error al abrir el PDF con el visor Canvas.';
      }
    }

    initPdf();
  </script>
</body>
</html>
