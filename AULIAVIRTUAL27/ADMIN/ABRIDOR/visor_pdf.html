<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .toolbar {
      background: #1e293b;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      gap: 12px;
      z-index: 10;
    }
    .file-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #475569; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .viewer-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      padding: 24px;
      background-image: radial-gradient(#334155 1px, transparent 1px);
      background-size: 20px 20px;
    }
    canvas {
      display: none;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border-radius: 4px;
      background: white;
      max-width: 100%;
    }
    .loading {
      margin: auto;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="toolbar">
    <span class="file-title">📄 {{FILE_NAME}}</span>
    <div class="controls">
      <button id="prev-page" onclick="onPrevPage()" disabled>◀ Anterior</button>
      <span style="font-size: 12px; font-weight: 600;" id="page-info">Pág: - / -</span>
      <button id="next-page" onclick="onNextPage()" disabled>Siguiente ▶</button>
      <button onclick="zoomOut()">➖</button>
      <button onclick="zoomIn()">➕</button>
    </div>
  </div>

  <div class="viewer-container">
    <div id="loading-msg" class="loading">Cargando documento PDF...</div>
    <canvas id="pdf-canvas"></canvas>
  </div>

  <script id="raw-data" type="text/plain">{{FILE_DATA_URL}}</script>

  <script>
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.25;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const loadingMsg = document.getElementById('loading-msg');

    function initPdfViewer() {
      if (typeof pdfjsLib === 'undefined') {
        loadingMsg.innerHTML = '<span style="color:#f43f5e;">No se pudo cargar la librería PDF.js (revisa tu conexión).</span>';
        return;
      }

      const raw = document.getElementById('raw-data').textContent.trim();
      if (!raw) {
        loadingMsg.innerHTML = '<span style="color:#f43f5e;">El archivo PDF no contiene datos.</span>';
        return;
      }

      try {
        // Extraer el Base64 tenga o no prefijo "data:application/pdf;base64,"
        const base64 = raw.includes(',') ? raw.split(',')[1].replace(/\s/g, '') : raw.replace(/\s/g, '');
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        // disableWorker: true evita el bloqueo de seguridad dentro del iframe srcdoc
        const loadingTask = pdfjsLib.getDocument({
          data: bytes,
          disableWorker: true
        });

        loadingTask.promise.then(function(pdf) {
          pdfDoc = pdf;
          loadingMsg.style.display = 'none';
          canvas.style.display = 'block';
          renderPage(pageNum);
        }).catch(function(err) {
          loadingMsg.innerHTML = `<span style="color:#f43f5e;">Error al abrir el PDF: ${err.message}</span>`;
        });
      } catch (err) {
        loadingMsg.innerHTML = `<span style="color:#f43f5e;">Error procesando el archivo: ${err.message}</span>`;
      }
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderTask = page.render({
          canvasContext: ctx,
          viewport: viewport
        });

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });

      document.getElementById('page-info').textContent = `Pág: ${num} / ${pdfDoc.numPages}`;
      document.getElementById('prev-page').disabled = (num <= 1);
      document.getElementById('next-page').disabled = (num >= pdfDoc.numPages);
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function onPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    function onNextPage() {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    function zoomIn() {
      if (!pdfDoc) return;
      scale = Math.min(3.5, scale + 0.25);
      queueRenderPage(pageNum);
    }

    function zoomOut() {
      if (!pdfDoc) return;
      scale = Math.max(0.5, scale - 0.25);
      queueRenderPage(pageNum);
    }

    initPdfViewer();
  </script>
</body>
</html>
