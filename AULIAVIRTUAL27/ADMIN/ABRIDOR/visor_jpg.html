<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .toolbar {
      background: #111827;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      gap: 10px;
      z-index: 10;
      flex-shrink: 0;
    }
    .file-name {
      font-size: 13px; 
      font-weight: 600; 
      overflow: hidden;
      text-overflow: ellipsis; 
      white-space: nowrap; 
      max-width: 45%; 
      color: #e2e8f0;
    }
    .controls { display: flex; align-items: center; gap: 6px; }
    button {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #334155; }
    
    /* Contenedor sin barras, preparado para arrastrar */
    .canvas-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(#1e293b 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      position: relative;
      cursor: grab;
      touch-action: none;
    }
    .canvas-container:active {
      cursor: grabbing;
    }

    img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="toolbar">
    <span class="file-name">🖼️ {{FILE_NAME}}</span>
    <div class="controls">
      <button onclick="zoom(-0.25)">➖</button>
      <button onclick="resetView()">100%</button>
      <button onclick="zoom(0.25)">➕</button>
      <button onclick="rotateImg()">↻ Rotar</button>
      <button onclick="toggleFS()">⛶</button>
    </div>
  </div>

  <div class="canvas-container" id="container">
    <img id="preview-img" alt="{{FILE_NAME}}" draggable="false">
  </div>

  <script id="raw-data" type="text/plain">{{FILE_DATA_URL}}</script>

  <script>
    let scale = 1, rotation = 0;
    let panX = 0, panY = 0;
    let isDragging = false, startX = 0, startY = 0;

    const img = document.getElementById('preview-img');
    const container = document.getElementById('container');
    const dataUrl = document.getElementById('raw-data').textContent.trim();
    
    if (dataUrl) img.src = dataUrl;

    function update() {
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale}) rotate(${rotation}deg)`;
    }
    
    function zoom(d) {
      scale = Math.max(0.3, Math.min(5, scale + d));
      update();
    }
    
    function rotateImg() {
      rotation = (rotation + 90) % 360;
      update();
    }
    
    function resetView() {
      scale = 1;
      rotation = 0;
      panX = 0;
      panY = 0;
      update();
    }
    
    function toggleFS() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    // Funciones de arrastre con ratón o táctil (Drag to Pan)
    container.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      container.setPointerCapture(e.pointerId);
    });

    container.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      update();
    });

    container.addEventListener('pointerup', (e) => {
      isDragging = false;
      try { container.releasePointerCapture(e.pointerId); } catch(err) {}
    });

    container.addEventListener('pointercancel', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
