<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILE_NAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .toolbar {
      background: #1e293b;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      gap: 10px;
      z-index: 10;
    }
    .file-name {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 50%;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #475569; }
    .canvas {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
      background-image: radial-gradient(#334155 1px, transparent 1px);
      background-size: 20px 20px;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="toolbar">
    <span class="file-name">🖼️ {{FILE_NAME}}</span>
    <div class="controls">
      <button onclick="zoom(-0.2)">➖</button>
      <button onclick="resetView()">100%</button>
      <button onclick="zoom(0.2)">➕</button>
      <button onclick="rotate()">↻ Rotar</button>
    </div>
  </div>

  <div class="canvas">
    <img id="preview-img" alt="{{FILE_NAME}}" draggable="false">
  </div>

  <script id="raw-data" type="text/plain">{{FILE_DATA_URL}}</script>

  <script>
    let scale = 1;
    let rotation = 0;
    const img = document.getElementById('preview-img');
    const dataUrl = document.getElementById('raw-data').textContent.trim();

    if (dataUrl) {
      img.src = dataUrl;
    }

    function updateTransform() {
      img.style.transform = `scale(${scale}) rotate(${rotation}deg)`;
    }
    function zoom(delta) {
      scale = Math.max(0.2, Math.min(4, scale + delta));
      updateTransform();
    }
    function rotate() {
      rotation = (rotation + 90) % 360;
      updateTransform();
    }
    function resetView() {
      scale = 1;
      rotation = 0;
      updateTransform();
    }
  </script>
</body>
</html>
