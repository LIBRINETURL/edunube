<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEVERSE | Grabación con Pausa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .feed-container {
            height: 100vh;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            background: #000;
        }

        #player-view { position: relative; height: 100%; width: 100%; }

        .video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #custom-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .side-nav {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 30;
        }

        .nav-arrow {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-info {
            position: absolute;
            bottom: 100px;
            left: 16px;
            right: 80px;
            z-index: 25;
            pointer-events: none;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 40;
            padding-bottom: 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,0.6);
        }

        .nav-item.active { color: #fff; }

        .create-btn-tk {
            width: 48px;
            height: 32px;
            background: #fff;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .create-btn-tk::before { content: ''; position: absolute; left: -3px; width: 100%; height: 100%; background: #20f3ee; border-radius: 8px; z-index: -1; }
        .create-btn-tk::after { content: ''; position: absolute; right: -3px; width: 100%; height: 100%; background: #fe2c55; border-radius: 8px; z-index: -2; }

        .glass-modal { background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(25px); }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
            overflow-y: auto;
            max-height: calc(100vh - 140px);
        }

        .library-item { aspect-ratio: 9/16; background: #111; position: relative; overflow: hidden; }
        .library-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Estilos Grabadora */
        .recording-blink { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        input[type="range"] { -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: currentColor; margin-top: -5px; }
    </style>
</head>
<body>

    <div class="feed-container">
        <!-- VISTA PLAYER -->
        <div id="player-view">
            <div class="video-info">
                <h3 id="video-display-title" class="text-white font-black text-lg drop-shadow-lg">Cargando...</h3>
            </div>

            <div class="side-nav">
                <button onclick="changeVideo(-1)" class="nav-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7" /></svg>
                </button>
                <button onclick="changeVideo(1)" class="nav-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" /></svg>
                </button>
            </div>

            <div class="video-wrapper">
                <div id="loading-overlay" class="absolute inset-0 flex items-center justify-center z-50 bg-black">
                    <div class="h-10 w-10 rounded-full border-4 border-t-white border-white/20 animate-spin"></div>
                </div>
                <video id="custom-player" playsinline loop autoplay></video>
                <div class="absolute inset-0 z-10" onclick="handleInteraction()"></div>
            </div>
        </div>

        <!-- VISTA LIBRERÍA -->
        <div id="library-view" class="h-full w-full bg-black hidden flex-col pt-12">
            <h1 class="text-xl font-black px-4 mb-4 uppercase">Mis Videos</h1>
            <div id="library-container" class="library-grid"></div>
        </div>

        <!-- NAV -->
        <nav class="bottom-nav">
            <button onclick="switchView('player')" id="nav-home" class="nav-item active">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="text-[10px] font-bold">Inicio</span>
            </button>
            <button onclick="openCreateMenu()" class="create-btn-tk">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
            </button>
            <button onclick="switchView('library')" id="nav-library" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16m-7 6h7" /></svg>
                <span class="text-[10px] font-bold">Mis Videos</span>
            </button>
        </nav>
    </div>

    <!-- MODAL CREACIÓN -->
    <div id="create-modal" class="fixed inset-0 z-50 glass-modal hidden flex-col items-center justify-center p-6 text-center">
        <div class="w-full max-w-md space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black italic text-white uppercase tracking-tighter">Crear</h2>
                <button onclick="closeModals()" class="p-2 bg-white/10 rounded-full"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <input type="text" id="video-title-input" placeholder="Título del video..." class="bg-zinc-900 border border-white/10 p-4 w-full rounded-xl outline-none font-bold text-white">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="triggerFileInput()" class="flex flex-col items-center gap-3 p-6 bg-zinc-900 rounded-2xl border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    <span class="text-[10px] font-bold uppercase">Galería</span>
                </button>
                <button onclick="startCamera()" class="flex flex-col items-center gap-3 p-6 bg-zinc-900 rounded-2xl border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                    <span class="text-[10px] font-bold uppercase">Cámara</span>
                </button>
            </div>
            <input type="file" id="real-file-input" accept="video/*" class="hidden" onchange="handleFileSelect(this)">
        </div>
    </div>

    <!-- GRABADORA -->
    <div id="recorder-container" class="fixed inset-0 z-[60] bg-black hidden flex-col items-center">
        <!-- Cronómetro Superior -->
        <div id="rec-timer-mini" class="absolute top-12 z-40 bg-black/50 backdrop-blur-xl px-4 py-1.5 rounded-full border border-white/20 text-[10px] font-black tracking-widest hidden">00:00 / 01:00</div>
        
        <div class="absolute top-24 w-full px-6 flex flex-col items-center gap-4 z-30">
            <button id="music-select-btn" onclick="openMusicModal()" class="bg-black/60 backdrop-blur-md border border-white/20 text-white px-5 py-2 rounded-full font-bold text-sm">🎵 Elegir Sonido</button>
        </div>

        <video id="webcam-view" autoplay muted class="w-full h-full object-cover"></video>
        
        <!-- MEZCLADOR DE AUDIO -->
        <div id="audio-mixer" class="absolute bottom-44 w-full px-8 flex flex-col gap-3 z-30">
            <div class="flex items-center gap-3 bg-black/50 backdrop-blur-md px-4 py-2 rounded-full border border-white/10">
                <span class="text-[8px] font-bold w-6">MIC</span>
                <input type="range" id="mic-vol" min="0" max="1" step="0.05" value="1" class="w-full text-cyan-400" oninput="updateVolumes()">
            </div>
            <div id="song-mixer-container" class="flex items-center gap-3 bg-black/50 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 opacity-40 pointer-events-none transition-opacity">
                <span class="text-[8px] font-bold w-6">SON</span>
                <input type="range" id="song-vol" min="0" max="1" step="0.05" value="0.3" class="w-full text-rose-500" oninput="updateVolumes()">
            </div>
        </div>

        <!-- CONTROLES DE GRABACIÓN -->
        <div class="absolute bottom-12 flex items-center justify-center gap-8 w-full z-30">
            <button onclick="stopCamera()" class="p-4 bg-white/10 rounded-full border border-white/10 hover:bg-white/20 transition-colors">
                <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            
            <button id="rec-btn" class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center bg-transparent group">
                <div id="rec-dot" class="w-14 h-14 bg-rose-600 rounded-full transition-all group-active:scale-90"></div>
            </button>

            <!-- Botón Pausa/Reanudar -->
            <button id="pause-btn" onclick="togglePause()" class="hidden p-4 bg-white/10 rounded-full border border-white/10 hover:bg-white/20 transition-colors">
                <svg id="pause-icon" class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <svg id="resume-icon" class="h-6 w-6 text-white hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <!-- MODAL MÚSICA -->
    <div id="music-modal" class="fixed inset-0 z-[70] glass-modal hidden flex-col items-center justify-end">
        <div class="w-full max-w-md bg-zinc-950 rounded-t-3xl h-[70vh] flex flex-col">
            <div class="p-4 flex justify-between items-center border-b border-white/10">
                <span class="font-bold text-white uppercase text-xs tracking-widest">Elegir Sonido</span>
                <button onclick="closeMusicModal()"><svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <div class="p-4"><input type="text" id="music-search" placeholder="Buscar canciones..." class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-2 text-white outline-none" onkeydown="if(event.key === 'Enter') searchMusic(this.value)"></div>
            <div id="music-results" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        </div>
    </div>

    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2 rounded-full font-bold text-[10px] uppercase z-[100] transform -translate-y-24 transition-all duration-300 shadow-2xl"></div>

    <script>
        const MUX_TOKEN_ID = '0998a541-a582-43f6-930f-3dc11a8a02ef';
        const MUX_TOKEN_SECRET = 'IbkkwvGTZ+RzN0OJp6Ms0/U7yTqPoGvEr//Bay+/BUFva9HZtjxt2hMXWYjpsu4rX+/GolUIj/n';
        const auth = btoa(`${MUX_TOKEN_ID}:${MUX_TOKEN_SECRET}`);
        const PROXY = 'https://corsproxy.io/?';

        let videoAssets = [], currentIndex = 0, hls = null, userInteracted = false;
        let audioCtx = null, selectedSongBuffer = null, songSourceNode = null, micGainNode = null, songGainNode = null;
        let isRecording = false, isPaused = false, mediaRecorder = null, cameraStream = null;
        let recTimer, recordedSeconds = 0, songStartTime = 0;
        let audioDest = null;
        let chunks = [];

        window.onload = () => fetchVideoList();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = msg; t.style.transform = 'translate(-50%, 0)';
            setTimeout(() => { t.style.transform = 'translate(-50%, -100px)'; }, 2500);
        }

        async function fetchVideoList() {
            try {
                const api = PROXY + encodeURIComponent('https://api.mux.com/video/v1/assets?limit=50&status=ready');
                const resp = await fetch(api, { headers: { 'Authorization': `Basic ${auth}` } });
                const json = await resp.json();
                if (json.data) { videoAssets = json.data; renderVideo(currentIndex); renderLibrary(); document.getElementById('loading-overlay').classList.add('hidden'); }
            } catch (e) { showToast('Error cargando videos'); }
        }

        function renderVideo(index) {
            if (!videoAssets[index]) return;
            const asset = videoAssets[index];
            const videoUrl = `https://stream.mux.com/${asset.playback_ids[0].id}.m3u8`;
            const video = document.getElementById('custom-player');
            document.getElementById('video-display-title').textContent = asset.passthrough || "MEVERSE VIDEO";

            if (!userInteracted) video.muted = true;
            if (hls) hls.destroy();
            hls = new Hls(); hls.loadSource(videoUrl); hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        }

        function changeVideo(dir) {
            currentIndex = (currentIndex + dir + videoAssets.length) % videoAssets.length;
            renderVideo(currentIndex);
        }

        function renderLibrary() {
            const container = document.getElementById('library-container');
            container.innerHTML = videoAssets.map((asset, idx) => `
                <div class="library-item" onclick="selectVideoFromLibrary(${idx})">
                    <img src="https://image.mux.com/${asset.playback_ids[0].id}/thumbnail.jpg?width=320">
                </div>
            `).join('');
        }

        function selectVideoFromLibrary(idx) { currentIndex = idx; switchView('player'); renderVideo(idx); userInteracted = true; document.getElementById('custom-player').muted = false; }

        function switchView(v) {
            document.getElementById('player-view').classList.toggle('hidden', v !== 'player');
            document.getElementById('library-view').classList.toggle('hidden', v !== 'library');
            document.getElementById('nav-home').classList.toggle('active', v === 'player');
            document.getElementById('nav-library').classList.toggle('active', v === 'library');
            const video = document.getElementById('custom-player');
            v === 'player' ? video.play() : video.pause();
        }

        function handleInteraction() {
            const v = document.getElementById('custom-player');
            if (!userInteracted) { userInteracted = true; v.muted = false; v.play(); return; }
            v.paused ? v.play() : v.pause();
        }

        function triggerFileInput() { document.getElementById('real-file-input').click(); }
        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.onloadedmetadata = () => {
                if (video.duration > 61) { showToast('❌ MÁXIMO 1 MINUTO'); input.value = ""; }
                else uploadVideo(file);
            };
            video.src = URL.createObjectURL(file);
        }

        // --- AUDIO Y MÚSICA ---
        function openMusicModal() { if (!audioCtx) audioCtx = new AudioContext(); document.getElementById('music-modal').classList.remove('hidden'); document.getElementById('music-modal').classList.add('flex'); }
        function closeMusicModal() { document.getElementById('music-modal').classList.add('hidden'); }
        async function searchMusic(q) {
            const res = document.getElementById('music-results');
            res.innerHTML = '<div class="text-center py-4 text-xs font-bold text-white/40">Buscando...</div>';
            const r = await fetch(`https://itunes.apple.com/search?country=ES&entity=song&term=${encodeURIComponent(q)}&limit=10`);
            const data = await r.json();
            res.innerHTML = data.results.map(t => `
                <div onclick="selectSong('${t.previewUrl}', '${t.trackName}')" class="flex items-center gap-3 p-3 bg-zinc-900 rounded-xl hover:bg-zinc-800 transition-colors cursor-pointer">
                    <img src="${t.artworkUrl100}" class="w-10 h-10 rounded-lg">
                    <div class="flex-1 truncate text-xs font-bold text-white">${t.trackName}</div>
                </div>
            `).join('');
        }
        async function selectSong(url, name) {
            showToast('Sincronizando sonido...');
            const r = await fetch(url);
            const buf = await r.arrayBuffer();
            selectedSongBuffer = await audioCtx.decodeAudioData(buf);
            document.getElementById('music-select-btn').innerHTML = `🎵 ${name}`;
            document.getElementById('song-mixer-container').classList.remove('opacity-40', 'pointer-events-none');
            closeMusicModal();
        }

        // --- GRABACIÓN Y PAUSA ---
        async function startCamera() {
            if (!audioCtx) audioCtx = new AudioContext();
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
            document.getElementById('webcam-view').srcObject = cameraStream;
            document.getElementById('recorder-container').classList.remove('hidden');
            document.getElementById('recorder-container').classList.add('flex');
            
            document.getElementById('rec-btn').onclick = () => {
                if (!isRecording) startRecording();
                else finishRecording();
            };
        }

        function startRecording() {
            isRecording = true;
            isPaused = false;
            recordedSeconds = 0;
            songStartTime = 0;
            chunks = [];

            document.getElementById('rec-timer-mini').classList.remove('hidden');
            document.getElementById('pause-btn').classList.remove('hidden');
            document.getElementById('rec-dot').classList.replace('rounded-full', 'rounded-sm');

            // Configuración de Audio Mixing
            audioDest = audioCtx.createMediaStreamDestination();
            const micSource = audioCtx.createMediaStreamSource(new MediaStream([cameraStream.getAudioTracks()[0]]));
            micGainNode = audioCtx.createGain(); 
            micGainNode.gain.value = parseFloat(document.getElementById('mic-vol').value);
            micSource.connect(micGainNode);
            micGainNode.connect(audioDest);

            if (selectedSongBuffer) {
                playMusicFrom(0);
            }

            // Stream Final (Video + Audio Mezclado)
            const videoTrack = cameraStream.getVideoTracks()[0];
            const combined = new MediaStream([videoTrack, ...audioDest.stream.getAudioTracks()]);
            
            mediaRecorder = new MediaRecorder(combined);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => uploadVideo(new Blob(chunks, { type: 'video/webm' }));
            mediaRecorder.start();

            startTimer();
        }

        function playMusicFrom(seconds) {
            if (songSourceNode) try { songSourceNode.stop(); } catch(e) {}
            songSourceNode = audioCtx.createBufferSource();
            songSourceNode.buffer = selectedSongBuffer;
            songGainNode = audioCtx.createGain();
            songGainNode.gain.value = parseFloat(document.getElementById('song-vol').value);
            songSourceNode.connect(songGainNode);
            songGainNode.connect(audioDest);
            songGainNode.connect(audioCtx.destination);
            songSourceNode.start(0, seconds);
        }

        function togglePause() {
            if (!isRecording) return;
            
            if (!isPaused) {
                // ACCIÓN: PAUSAR
                isPaused = true;
                mediaRecorder.pause();
                if (songSourceNode) try { songSourceNode.stop(); } catch(e) {}
                clearInterval(recTimer);
                
                document.getElementById('pause-icon').classList.add('hidden');
                document.getElementById('resume-icon').classList.remove('hidden');
                document.getElementById('rec-timer-mini').classList.add('recording-blink');
                document.getElementById('rec-dot').classList.add('recording-blink');
                showToast('⏸ PAUSADO');
            } else {
                // ACCIÓN: REANUDAR
                isPaused = false;
                mediaRecorder.resume();
                if (selectedSongBuffer) {
                    playMusicFrom(recordedSeconds);
                }
                startTimer();
                
                document.getElementById('pause-icon').classList.remove('hidden');
                document.getElementById('resume-icon').classList.add('hidden');
                document.getElementById('rec-timer-mini').classList.remove('recording-blink');
                document.getElementById('rec-dot').classList.remove('recording-blink');
            }
        }

        function startTimer() {
            recTimer = setInterval(() => {
                recordedSeconds++;
                const min = String(Math.floor(recordedSeconds/60)).padStart(2,'0');
                const sec = String(recordedSeconds%60).padStart(2,'0');
                document.getElementById('rec-timer-mini').textContent = `${min}:${sec} / 01:00`;
                if(recordedSeconds >= 60) finishRecording();
            }, 1000);
        }

        function finishRecording() {
            isRecording = false;
            clearInterval(recTimer);
            if (songSourceNode) try { songSourceNode.stop(); } catch(e) {}
            document.getElementById('rec-timer-mini').classList.add('hidden');
            document.getElementById('pause-btn').classList.add('hidden');
            mediaRecorder.stop();
        }

        function stopCamera() {
            if(cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            document.getElementById('recorder-container').classList.add('hidden');
            document.getElementById('rec-dot').className = "w-14 h-14 bg-rose-600 rounded-full transition-all";
            if (songSourceNode) try { songSourceNode.stop(); } catch(e) {}
            clearInterval(recTimer);
            isRecording = false;
        }

        async function uploadVideo(blob) {
            const title = document.getElementById('video-title-input').value || 'Video de MeVerse';
            closeModals(); stopCamera();
            showToast('🚀 PROCESANDO...');
            const r = await fetch(PROXY + encodeURIComponent('https://api.mux.com/video/v1/uploads'), {
                method: 'POST',
                headers: { 'Authorization': `Basic ${auth}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_asset_settings: { playback_policy: ['public'], passthrough: title }, cors_origin: window.location.origin })
            });
            const data = await r.json();
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', data.data.url);
            xhr.onload = () => { showToast('✨ PUBLICADO'); setTimeout(fetchVideoList, 4000); };
            xhr.send(blob);
        }

        function openCreateMenu() { document.getElementById('create-modal').classList.remove('hidden'); document.getElementById('create-modal').classList.add('flex'); document.getElementById('custom-player').pause(); }
        function closeModals() { document.getElementById('create-modal').classList.add('hidden'); document.getElementById('custom-player').play(); }
        function updateVolumes() {
            const mv = parseFloat(document.getElementById('mic-vol').value);
            const sv = parseFloat(document.getElementById('song-vol').value);
            if (micGainNode) micGainNode.gain.setTargetAtTime(mv, audioCtx.currentTime, 0.01);
            if (songGainNode) songGainNode.gain.setTargetAtTime(sv, audioCtx.currentTime, 0.01);
        }
    </script>
</body>
</html>
