<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subida Directa a Mux</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #drop-zone { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 20px; }
        progress { width: 100%; height: 20px; }
    </style>
</head>
<body>

    <h2>Subidor de Video (Mux)</h2>
    <div id="drop-zone">
        <input type="file" id="video-input" accept="video/*">
    </div>
    
    <div id="upload-status" style="display:none;">
        <progress id="progress-bar" value="0" max="100"></progress>
        <p id="status-text">Preparando...</p>
    </div>

    <script type="module">
        import * as UpChunk from 'https://esm.sh/@mux/upchunk';

        // Tus credenciales de la imagen
        const TOKEN_ID = 'e3ef36ac-5d7d-4bb5-8be5-2f9b327dee4e';
        const TOKEN_SECRET = 'w9GYaE/JPunikZdZ0PkEpx4S4BAWagzQCJBAHiKHgvlhyMmf4MHOjSZmJtU0tYnTT9L/BOOOECA';

        const input = document.getElementById('video-input');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const statusDiv = document.getElementById('upload-status');

        input.onchange = async () => {
            if (!input.files[0]) return;

            statusDiv.style.display = 'block';
            statusText.innerText = "Solicitando permiso a Mux...";

            try {
                // 1. Crear el Upload en Mux
                const response = await fetch('https://api.mux.com/video/v1/uploads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(`${TOKEN_ID}:${TOKEN_SECRET}`)
                    },
                    body: JSON.stringify({
                        new_asset_settings: { 
                            playback_policy: ['public'] 
                        },
                        cors_origin: '*' // Esto permite subir desde cualquier sitio local para pruebas
                    })
                });

                const result = await response.json();
                
                if (!response.ok) throw new Error(result.error.message);

                const uploadUrl = result.data.url;

                // 2. Ejecutar la subida por partes (UpChunk)
                const upload = UpChunk.createUpload({
                    endpoint: uploadUrl,
                    file: input.files[0],
                    chunkSize: 5120, // 5MB por trozo
                });

                upload.on('progress', (ev) => {
                    progressBar.value = ev.detail;
                    statusText.innerText = `Subiendo archivo: ${Math.floor(ev.detail)}%`;
                });

                upload.on('success', () => {
                    statusText.innerText = "¡Éxito! El video ya está en Mux y se está procesando.";
                });

                upload.on('error', (err) => {
                    statusText.innerText = "Error: " + err.detail;
                });

            } catch (error) {
                statusText.innerText = "Error: " + error.message;
                console.error(error);
            }
        };
    </script>
</body>
</html>
